[project]
name = "manga-scraper"
version = "0.1.0"
description = "Polite collection service for MANGA PERFORMANCE: claims jobs from the web app, pushes results through the signed internal API."
requires-python = ">=3.12"
dependencies = [
  "scrapy>=2.12",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scraper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
