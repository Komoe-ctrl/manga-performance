name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: manga
          POSTGRES_PASSWORD: manga_ci_password
          POSTGRES_DB: manga_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U manga -d manga_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://manga:manga_ci_password@localhost:5432/manga_test
      TEST_DATABASE_URL: postgresql://manga:manga_ci_password@localhost:5432/manga_test
      # The storage tests must run in CI, not be skipped.
      REQUIRE_S3: "1"
    steps:
      - name: Start MinIO (S3-compatible storage for the integration tests)
        run: |
          docker run -d --name minio -p 9100:9000 \
            -e MINIO_ROOT_USER=manga -e MINIO_ROOT_PASSWORD=manga_dev_password \
            -e MINIO_DEFAULT_BUCKETS=manga-test \
            bitnamilegacy/minio:latest
          for i in $(seq 1 30); do curl -fsS http://localhost:9100/minio/health/live && break; sleep 2; done
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Apply migrations
        run: pnpm db:deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build web
        run: pnpm build
