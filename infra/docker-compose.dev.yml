# Development stack: `docker compose -f infra/docker-compose.dev.yml up -d --build` (or `pnpm stack:up`) starts everything
# (database, storage, web on http://localhost:3000, worker). Every service restarts with Docker, so once Docker
# is running the whole stack comes back by itself. The web app runs on the demonstration data (DATA_SOURCE=mock).
# The production stack is infra/docker-compose.yml.
name: manga-performance-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: manga
      POSTGRES_PASSWORD: manga_dev_password
      POSTGRES_DB: manga
    ports:
      # 5434 on the host: 5432 is commonly taken by other local projects.
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manga -d manga"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage for deliverables, message attachments and blog covers.
  # (MinIO no longer publishes images on Docker Hub; this is a Bitnami build of it, for development only.)
  minio:
    image: bitnamilegacy/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: manga
      MINIO_ROOT_PASSWORD: manga_dev_password
      MINIO_DEFAULT_BUCKETS: manga-performance,manga-test
    ports:
      # 9100 (API) and 9101 (console) on the host: 9000 is commonly taken by other projects.
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9001"
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ..
      dockerfile: infra/docker/app.Dockerfile
      args:
        DATA_SOURCE: mock
    image: manga-app-dev
    restart: unless-stopped
    environment: &dev-app-env
      # Development values (placeholders are refused when NODE_ENV=production, hence development here).
      NODE_ENV: development
      DATA_SOURCE: mock
      LOG_LEVEL: info
      DATABASE_URL: postgresql://manga:manga_dev_password@postgres:5432/manga
      BETTER_AUTH_SECRET: dev-only-better-auth-secret-change-me-0123456789
      APP_URL: http://localhost:3000
      EMAIL_PROVIDER: brevo
      BREVO_API_KEY: dev-brevo-key
      BREVO_WEBHOOK_SECRET: dev-brevo-webhook-secret
      EMAIL_FROM_TRANSACTIONAL: Cabinet <no-reply@example.com>
      EMAIL_FROM_MARKETING: Cabinet News <news@example.com>
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: manga-performance
      S3_ACCESS_KEY: manga
      S3_SECRET_KEY: manga_dev_password
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      INTERNAL_API_TOKEN: dev-only-internal-api-token-change-me-0123456789
      INTERNAL_API_HMAC_SECRET: dev-only-internal-hmac-secret-change-me-0123456789
      TRACKING_HMAC_SECRET: dev-only-tracking-hmac-secret-change-me-0123456789
      ADMIN_NOTIFICATION_EMAIL: admin@example.com
      TZ_DISPLAY: Africa/Abidjan
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    image: manga-app-dev
    restart: unless-stopped
    command: ["pnpm", "--filter", "@manga/worker", "start"]
    environment: *dev-app-env
    depends_on:
      web:
        condition: service_started

  # HTTPS tunnel without any account: the public address is printed in the logs
  # (`docker logs manga-performance-dev-tunnel-1`) and changes when the container is recreated.
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://web:3000"]
    depends_on:
      web:
        condition: service_started

  # HTTPS tunnel so the client can see the site before it is hosted. Needs infra/.env.ngrok (never committed):
  #   NGROK_AUTHTOKEN=...   NGROK_DOMAIN=your-name.ngrok-free.app   (optional: NGROK_BASIC_AUTH=user:password-of-8+chars)
  # Without that file the service idles and the rest of the stack is unaffected.
  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    env_file:
      - path: ./.env.ngrok
        required: false
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$NGROK_AUTHTOKEN" ] || [ -z "$$NGROK_DOMAIN" ]; then echo "ngrok: infra/.env.ngrok missing, tunnel not started"; sleep infinity; fi
        if [ -n "$$NGROK_BASIC_AUTH" ]; then exec ngrok http web:3000 --domain="$$NGROK_DOMAIN" --basic-auth="$$NGROK_BASIC_AUTH" --log=stdout; fi
        exec ngrok http web:3000 --domain="$$NGROK_DOMAIN" --log=stdout
    depends_on:
      web:
        condition: service_started

volumes:
  pgdata:
  miniodata:
